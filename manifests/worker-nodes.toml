# What the GPU worker runs, pinned: ComfyUI itself by tag, third-party custom
# nodes by commit. On deploy scripts/worker/sync-comfyui.ps1 moves the portable
# ComfyUI checkout to the tag and scripts/worker/sync-nodes.ps1 clones or moves
# each node under its custom_nodes/; ComfyUI is then restarted.

[comfyui]
tag = "v0.40.0"

[[node]]
name = "ComfyUI-layerdiffuse"
repo = "https://github.com/huchenlei/ComfyUI-layerdiffuse.git"
commit = "b4f6a9e024064a4489f774a8b91049ce0b606ea3"
install_requirements = true

[[node]]
name = "ComfyUI-Inpaint-CropAndStitch"
repo = "https://github.com/lquesada/ComfyUI-Inpaint-CropAndStitch.git"
commit = "606e2b4fd83fc44e1f0b403e1f076501db8c3749"
install_requirements = true

[[node]]
name = "ComfyUI-See-through"
repo = "https://github.com/jtydhr88/ComfyUI-See-through.git"
commit = "98d754bf04f668647919ab750eccb0e0640faa81"
install_requirements = true

[[node]]
name = "comfyui_controlnet_aux"
repo = "https://github.com/Fannovel16/comfyui_controlnet_aux.git"
commit = "e8b689a513c3e6b63edc44066560ca5919c0576e"
install_requirements = true

[[node]]
name = "ComfyUI_IPAdapter_plus"
repo = "https://github.com/cubiq/ComfyUI_IPAdapter_plus.git"
commit = "a0f451a5113cf9becb0847b92884cb10cbdec0ef"
install_requirements = true

[[node]]
name = "ComfyUI-RMBG"
repo = "https://github.com/1038lab/ComfyUI-RMBG.git"
commit = "58f1947a11567a9f8b707223185570850e773856"
install_requirements = false
pip = ["timm"]
