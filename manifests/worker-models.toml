# Model files the GPU worker needs that come from Hugging Face (pinned by repo
# and commit) or Civitai (pinned by model version id). scripts/worker_models.py
# puts each at models/<dest> under the ComfyUI root, checks it against the
# SHA256 the source publishes for the file (the git blob SHA1 for a small file
# Hugging Face keeps outside LFS, and `sha256` here when it is given), and leaves a file already there with that content alone
# (`<dest>.sha256` records it). The "fetch worker models" workflow runs it
# on the box. Files not listed here are fetched by hand (docs/remote.md).

# Pixal3D image-to-3D in ComfyUI core: the native template loads both the
# Pixal3D and the TRELLIS.2 diffusion model, so both are listed. Comfy-Org
# repackages each model in its own repo; the TRELLIS.2 VAEs ship with Pixal3D.
[[model]]
dest = "diffusion_models/pixal3d_multiview_int8_convrot.safetensors"
repo = "Comfy-Org/Pixal3D"
file = "diffusion_models/pixal3d_multiview_int8_convrot.safetensors"
revision = "f37641be376725d324c56626007cc477f1249a69"

[[model]]
dest = "diffusion_models/pixal3d_int8_convrot.safetensors"
repo = "Comfy-Org/Pixal3D"
file = "diffusion_models/pixal3d_int8_convrot.safetensors"
revision = "f37641be376725d324c56626007cc477f1249a69"

[[model]]
dest = "diffusion_models/trellis_2_int8_convrot.safetensors"
repo = "Comfy-Org/TRELLIS.2"
file = "diffusion_models/trellis_2_int8_convrot.safetensors"
revision = "430a9d09b2416687018c8fe8edced2ad4858a439"

