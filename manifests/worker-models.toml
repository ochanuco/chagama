# SilvermoonMix Anima Turbo from Civitai, pinned by version id; the file is the
# version's primary Model file. dest is a fixed name so recipes do not change
# when the version is bumped.
[[model]]
dest = "diffusion_models/silvermoon-turbo.safetensors"
civitai_model = 2639339
civitai_version = 3335132 # v2.3_2.9B_Turbo

