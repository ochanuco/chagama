# Model files the GPU worker needs that come from Hugging Face (pinned by repo
# and revision) or Civitai (pinned by model version id). scripts/worker_models.py
# puts each at models/<dest> under the ComfyUI root, checks it against the
# SHA256 the source publishes for the file (and against `sha256` here when it
# is given), and leaves a file already there with that content alone
# (`<dest>.sha256` records it). The "fetch worker models" workflow runs it
# on the box. Files not listed here are fetched by hand (docs/remote.md).

# Pixal3D image-to-3D in ComfyUI core: the native template loads both the
# Pixal3D and the TRELLIS.2 diffusion model, so both are listed. Comfy-Org
# repackages each model in its own repo; the TRELLIS.2 VAEs ship with Pixal3D.
[[model]]
dest = "diffusion_models/pixal3d_multiview_int8_convrot.safetensors"
repo = "Comfy-Org/Pixal3D"
file = "diffusion_models/pixal3d_multiview_int8_convrot.safetensors"
revision = "main"

[[model]]
dest = "diffusion_models/pixal3d_int8_convrot.safetensors"
repo = "Comfy-Org/Pixal3D"
file = "diffusion_models/pixal3d_int8_convrot.safetensors"
revision = "main"

[[model]]
dest = "diffusion_models/trellis_2_int8_convrot.safetensors"
repo = "Comfy-Org/TRELLIS.2"
file = "diffusion_models/trellis_2_int8_convrot.safetensors"
revision = "main"

[[model]]
dest = "vae/trellis_2_shape_vae_bf16.safetensors"
repo = "Comfy-Org/Pixal3D"
file = "vae/trellis_2_shape_vae_bf16.safetensors"
revision = "main"

[[model]]
dest = "vae/trellis_2_texture_vae_bf16.safetensors"
repo = "Comfy-Org/Pixal3D"
file = "vae/trellis_2_texture_vae_bf16.safetensors"
revision = "main"

[[model]]
dest = "clip_vision/dino_v3_L_naf_fp32.safetensors"
repo = "Comfy-Org/Pixal3D"
file = "clip_vision/dino_v3_L_naf_fp32.safetensors"
revision = "main"

[[model]]
dest = "geometry_estimation/moge_2_vitl_normal_fp16.safetensors"
repo = "Comfy-Org/MoGe"
file = "geometry_estimation/moge_2_vitl_normal_fp16.safetensors"
revision = "main"

[[model]]
dest = "background_removal/birefnet.safetensors"
repo = "Comfy-Org/BiRefNet"
file = "background_removal/birefnet.safetensors"
revision = "main"

# SilvermoonMix Anima Turbo from Civitai, pinned by version id; the file is the
# version's primary Model file. dest is a fixed name so recipes do not change
# when the version is bumped.
[[model]]
dest = "diffusion_models/silvermoon-turbo.safetensors"
civitai_model = 2639339
civitai_version = 3335132 # v2.3_2.9B_Turbo
