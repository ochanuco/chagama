[project]
name = "chagama"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[project.scripts]
chagama = "chagama.interfaces.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Runtime dependencies are installed explicitly into .venv (see ci.yml);
# unmanaged keeps `uv sync` from uninstalling them.
[tool.uv]
managed = false

# The tests for scripts/ import those modules by bare name, the way the CI
# preflight runs them (PYTHONPATH=scripts).
[tool.pytest.ini_options]
pythonpath = ["scripts"]
