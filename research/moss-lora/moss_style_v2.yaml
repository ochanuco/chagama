job: extension
config:
  name: moss_style_v2
  process:
    - type: sd_trainer
      training_folder: <training_folder>
      device: cuda:0
      trigger_word: chgmstyle
      network:
        type: lora
        linear: 32
        linear_alpha: 32
        network_kwargs:
          ignore_if_contains: ["layers.22."]
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 5
      datasets:
        - folder_path: <dataset_folder>
          caption_ext: txt
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          resolution: [1024]
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        cache_text_embeddings: true
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        timestep_type: shift
        optimizer: adamw8bit
        lr: 1e-4
        dtype: bf16
        disable_sampling: true
      model:
        name_or_path: OpenMOSS-Team/MOSS-Image-SFT
        arch: moss_image
        quantize: true
        qtype: convrot8
        quantize_te: true
        qtype_te: convrot8
        low_vram: true
        model_kwargs:
          uncond_skip_layers: [22]
      sample:
        sampler: flowmatch
        sample_every: 100000
        width: 768
        height: 1152
        guidance_scale: 3
        sample_steps: 25
        seed: 42
        prompts:
          - "chgmstyle. Yuzuki Yukari, full body, sitting on the floor hugging her knees. Plain green background."
