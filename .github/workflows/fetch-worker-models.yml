name: fetch worker models

# GPU 機で動いている版の manifests/worker-models.toml に、ComfyUI の models/ を揃える。手動実行だけ。
# 実行は chabatake の gpu-box-app の運用コマンド fetch-models（dry_run なら fetch-models-dry-run）。
# ComfyUI はモデル一覧をリクエストごとに読むので再起動はしない。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: check Hugging Face and the disk, download nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fetch:
    name: fetch the pinned models onto the GPU box through chabatake
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 240
    concurrency:
      group: gpu-box-chagama
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/gpu-box-app
        with:
          action: op
          op: ${{ inputs.dry_run && 'fetch-models-dry-run' || 'fetch-models' }}
          op-service-account-token: ${{ secrets.OP_SA_DEPLOY }}
