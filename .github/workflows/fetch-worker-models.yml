name: fetch worker models

# GPU 機で動いている版の manifests/worker-models.toml に、ComfyUI の models/ を揃える。手動実行だけ。
# 実行は chabatake の gpu-box-app の運用コマンド fetch-models（dry_run なら fetch-models-dry-run）。
# ComfyUI はモデル一覧をリクエストごとに読むので再起動はしない。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: check Hugging Face and the disk, download nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fetch:
    name: fetch the pinned models onto the GPU box through chabatake
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 240
    concurrency:
      group: gpu-box-chagama
      cancel-in-progress: false
    steps:
      - uses: ochanuco/.github/actions/chabatake-dispatch@ddb8e656d5e975d255c122b0090df4efcb7a5cae # v1.8.0
        with:
          workflow: gpu-box-app.yml
          inputs: >-
            {"app": "chagama", "action": "op", "op": "${{ inputs.dry_run && 'fetch-models-dry-run' || 'fetch-models' }}"}
          title: >-
            gpu-box-app: op ${{ inputs.dry_run && 'fetch-models-dry-run' || 'fetch-models' }}
          wait-minutes: "230"
          poll-seconds: "30"
          cancelled-message: superseded by a later call, did not run
          op-service-account-token: ${{ secrets.OP_SA_DEPLOY }}
