name: restart worker comfyui

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart:
    name: restart the GPU box's ComfyUI through chabatake
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 240
    concurrency:
      group: gpu-box-chagama
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/gpu-box-app
        with:
          action: restart
          op-service-account-token: ${{ secrets.OP_SA_DEPLOY }}
