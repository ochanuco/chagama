name: restart worker comfyui

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart:
    name: restart the GPU box's ComfyUI through chabatake
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 240
    concurrency:
      group: gpu-box-chagama
      cancel-in-progress: false
    steps:
      - uses: ochanuco/.github/actions/chabatake-dispatch@ddb8e656d5e975d255c122b0090df4efcb7a5cae # v1.8.0
        with:
          workflow: gpu-box-app.yml
          inputs: '{"app": "chagama", "action": "restart"}'
          title: 'gpu-box-app: restart'
          wait-minutes: "230"
          poll-seconds: "30"
          cancelled-message: superseded by a later call, did not run
          op-service-account-token: ${{ secrets.OP_SA_DEPLOY }}
