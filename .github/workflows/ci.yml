name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/uv.yml@ddb8e656d5e975d255c122b0090df4efcb7a5cae # v1.8.0
    with:
      python-version: "3.13"
      run: bash scripts/check.sh
