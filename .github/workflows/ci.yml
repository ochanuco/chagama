name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/uv.yml@194995de7425c6457f8d802510787afd02ed9235 # v1.7.0
    with:
      python-version: "3.13"
      run: bash scripts/check.sh
