name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/uv.yml@737e6affb5e43803670afb13376dded4731e3388 # v1.5.0
    with:
      python-version: "3.13"
      run: bash scripts/check.sh
