name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/uv.yml@5dc4f2961ad12425cb2b3c6ab38cd52c9b8b6558 # main
    with:
      run: bash scripts/check.sh
