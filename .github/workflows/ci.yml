name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ochanuco/.github/.github/workflows/uv.yml@f41400013689c51685e10ba1523bfbb576f687dd # v1.0.0
    with:
      run: bash scripts/check.sh
