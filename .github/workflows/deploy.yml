name: deploy
run-name: deploy chagama @ ${{ inputs.ref || github.sha }}

# 本番（GPU 機）へのデプロイ。main への push で出し、承認は plan が要ると判定したときだけ
# Environment production-approval で止まる。workflow_dispatch はロールバックと出し直し用。
# zip を Release として公開し、GPU 機への配備は chabatake の gpu-box-app に任せる。
on:
  push:
    branches: [main]
    # worker の動作に関わらないパスだけの push では出さない（ComfyUI を再起動しない）
    paths-ignore:
      - "docs/**"
      - "research/**"
      - "experiments/**"
      - "tests/**"
      - ".claude/**"
      - ".github/**"
      - "**/*.md"
      - "renovate.json5"
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイする ref（main、または main 上のコミット SHA。古い SHA はロールバック）
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-run-production
  cancel-in-progress: false

jobs:
  plan:
    uses: ochanuco/.github/.github/workflows/deploy-plan.yml@737e6affb5e43803670afb13376dded4731e3388 # v1.5.0
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ inputs.ref || 'main' }}
      approval-environment: production-approval
      notices: |
        manifests/worker-models.toml=デプロイの後に fetch worker models を実行する
        scripts/worker/register-comfyui.ps1=GPU 機で register-comfyui.ps1 を手で実行し直す

  approve:
    needs: plan
    if: needs.plan.outputs.approval-environment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.plan.outputs.approval-environment }}
    steps:
      - env:
          APPROVAL_ENVIRONMENT: ${{ needs.plan.outputs.approval-environment }}
        run: echo "approved in $APPROVAL_ENVIRONMENT"

  build:
    name: build the release zip
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.zip.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: zip
        env:
          SHA: ${{ needs.plan.outputs.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="r${RUN_NUMBER}-${SHA:0:7}"
          bash scripts/release/build.sh "$version" "$SHA" chagama.zip
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chagama-zip
          path: chagama.zip
          if-no-files-found: error

  deploy:
    name: publish the release and deploy it through chabatake
    needs: [plan, approve, build]
    # approve が飛ばされた（承認が要らない）ときも出す。plan の失敗と承認の拒否では出さない
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 240
    permissions:
      contents: write
    concurrency:
      group: gpu-box-chagama
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          sparse-checkout: |
            .github/actions
            scripts/release
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chagama-zip

      - id: release
        run: bash scripts/release/publish.sh

      - uses: ./.github/actions/gpu-box-app
        with:
          action: deploy
          version: ${{ steps.release.outputs.version }}
          op-service-account-token: ${{ secrets.OP_SA_DEPLOY }}

      - run: bash scripts/release/prune.sh 3
