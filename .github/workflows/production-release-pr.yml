name: production release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    uses: ochanuco/.github/.github/workflows/release-pr.yml@f41400013689c51685e10ba1523bfbb576f687dd # v1.0.0
    with:
      checklist: |
        - [ ] GPU 機の self-hosted runner が online（Settings → Actions → Runners）
        - [ ] chimera の requests キューに running が無い
      deploy-note: このPRを `production` に merge すると、GPU 機の self-hosted runner が checkout を `production` に進めて `work` を再起動します。
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
