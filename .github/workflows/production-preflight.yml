name: production preflight

# production への昇格 PR に付く required check。中身は main の CI と同じ scripts/check.sh
on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    uses: ochanuco/.github/.github/workflows/uv.yml@5dc4f2961ad12425cb2b3c6ab38cd52c9b8b6558 # main
    with:
      run: bash scripts/check.sh
