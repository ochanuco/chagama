name: pixal3d

# chimera の三面図（ターンアラウンド）を GPU 機のローカル ComfyUI で Pixal3D マルチビューに
# 通し、GLB と切り出した各面を artifact に残す。手動実行のみ（workflow_dispatch は
# リポジトリに書き込める人しか起動できない）。ブランチを選んで試せるよう ref は絞らない。
on:
  workflow_dispatch:
    inputs:
      generation:
        description: chimera short_id of the turnaround sheet
        required: true
        default: d9luf2
      views:
        description: figure index (0-based, left to right) for each side of the rig
        required: true
        default: front=0,left=2,back=4,right=5
      fov:
        description: horizontal FOV of the views in degrees
        required: true
        default: "20"

permissions:
  contents: read

concurrency:
  group: pixal3d
  cancel-in-progress: false

jobs:
  run:
    name: Pixal3D multi-view on the GPU box
    runs-on: [self-hosted, gpu-box]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run
        shell: cmd
        env:
          WORKER_CHECKOUT: ${{ vars.WORKER_CHECKOUT }}
          GENERATION: ${{ inputs.generation }}
          VIEWS: ${{ inputs.views }}
          FOV: ${{ inputs.fov }}
          PYTHONUTF8: "1"
        run: '"%WORKER_CHECKOUT%\.venv\Scripts\python.exe" "%GITHUB_WORKSPACE%\scripts\pixal3d_run.py" "%GENERATION%" --views "%VIEWS%" --fov "%FOV%" --repository "%WORKER_CHECKOUT%" --out "%RUNNER_TEMP%\pixal3d"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pixal3d-${{ inputs.generation }}-${{ github.run_number }}
          path: ${{ runner.temp }}/pixal3d
          if-no-files-found: warn
